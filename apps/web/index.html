<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>digitus2</title>
    <script>
      // A theme chosen with the switch (src/design/theme.ts), applied before the first paint so
      // the page never shows the system's theme first. Without one the stylesheet follows the
      // system. Blocked site data leaves the page to the system too.
      try {
        var theme = localStorage.getItem('digitus2.theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (e) {}
      // The language (src/i18n/i18n.ts): the one picked on the line at the foot of the library,
      // otherwise the first of the browser's languages the app speaks, otherwise English. Screen
      // readers read the page in it; main.tsx loads its texts before the first render.
      (function () {
        var known = ['en', 'nl', 'fr', 'es', 'pt'];
        var lang = null;
        try {
          lang = localStorage.getItem('digitus2.lang');
        } catch (e) {}
        if (known.indexOf(lang) < 0) {
          lang = 'en';
          var tags = navigator.languages || [navigator.language || ''];
          for (var i = 0; i < tags.length; i++) {
            var primary = String(tags[i]).split('-')[0].toLowerCase();
            if (known.indexOf(primary) >= 0) {
              lang = primary;
              break;
            }
          }
        }
        document.documentElement.lang = lang;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
